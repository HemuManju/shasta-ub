# SHASTA tutorial configuration, read by 01_shasta_hsi.ipynb
#
# SHASTA itself reads the top-level simulation keys and `experiment`.
# The sections `swarm`, `mission`, `human` and `collector` are read by the notebook.
# Edit a value, re-run the notebook from Step 3, and see what changes.

headless: true          # true: PyBullet runs without a window. false would open the 3D window
time_step: 1.0          # seconds per step. SHASTA sets PyBullet's fixedTimeStep to time_step / 10
total_time: 300
use_real_time: false

experiment:
  map_to_use: buffalo-small

swarm:
  uavs: 4               # drones in the UAV group
  ugvs: 3               # vehicles in the UGV group
  uav_start_node: 5     # map node where the UAV group starts (fixed, so runs are repeatable)
  ugv_start_node: 40
  uav_speed: 2.5        # metres per second: the most a vehicle moves each step
  ugv_speed: 2.5

mission:
  targets: 3            # how many target nodes the human must reach
  radius: 12.0          # metres: a target counts as reached when a group centre is this close
  time_limit: 2500      # simulation steps, or null for no limit
  seed: 0               # which targets: the same seed gives the same targets

human:
  steps_per_update: 6   # simulation steps per GUI frame
  session_seconds: 40   # length of the recorded session

collector:              # Step 8: the "visit all nodes" experiment
  n_nodes: 5
  episodes: 6
  strategies: [nearest, random]
